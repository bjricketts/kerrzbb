[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kerrzbb"
version = "0.0.1"
description = "Python bindings for kerrzbb, an on-the-fly ray-traced, differentiable KERRBB"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["kerrzbb"]
